name: Build e Deploy no Render

# a cada push na main, gera a imagem,
# publica no Docker Hub e avisa o Render para subir a versão nova.
on:
  push:
    branches: [main]
  workflow_dispatch:   # permite rodar na mão pela aba Actions

permissions:
  contents: read

env:
  IMAGE: docker.io/brun0la/relatorio-vaq

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets não podem ser usados direto no "if" de um passo; por isso passam por aqui
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (JVM) e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Na primeira execução o serviço ainda não existe no Render: este passo é pulado
      - name: Disparar deploy no Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          IMG_URL=$(printf '%s' "${IMAGE}:${GITHUB_SHA}" | jq -sRr @uri)
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMG_URL}"
